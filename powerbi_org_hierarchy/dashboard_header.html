<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Root layout — mirrors the card/canvas background of the hierarchy ── */
  body {
    background: #FFFFFF;
  }

  .header {
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 70px;
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 2px 2px 0 #00000015;
  }

  /* ── Colour band — matches depth-0 (C-Suite) header band ── */
  .band {
    width: 7px;
    flex-shrink: 0;
    background: #1E3A5F;
  }

  /* ── Body ── */
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px 0 12px;
    gap: 12px;
  }

  /* ── LEFT: icon + title ── */
  .left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-wrap {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    background: #1E3A5F;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-wrap svg { width: 14px; height: 14px; }

  .titles { display: flex; flex-direction: column; gap: 1px; }

  /* Level badge — same style as the ▸ tier label inside node headers */
  .badge {
    display: inline-block;
    font-size: 7px;
    font-weight: 700;
    color: #DBEAFE;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    background: #1E3A5F;
    border-radius: 3px;
    padding: 1px 5px;
    align-self: flex-start;
    margin-bottom: 2px;
  }

  /* Main title — same weight/colour as the Name field on a node card */
  .title {
    font-size: 14px;
    font-weight: 700;
    color: #0F172A;
    letter-spacing: -0.3px;
    line-height: 1.1;
    white-space: nowrap;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 1px;
    height: 22px;
    background: #E2E8F0;
    flex-shrink: 0;
  }

  /* ── CENTER: scope tag — matches Department italic style ── */
  .scope {
    font-size: 9px;
    font-style: italic;
    color: #64748B;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── RIGHT: tier legend ── */
  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .tier {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 7px;
    border-radius: 4px;       /* matches node card rx */
    border: 1px solid #CBD5E1;
    background: #F8FAFC;
  }

  /* 10×10 swatch — same shape as the legend squares in the Vega spec */
  .swatch {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .tier-label {
    font-size: 8px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* Exact colours from the Vega template depth expressions */
  .t0 { background: #1E3A5F; }  /* C-Suite   — depth 0 */
  .t1 { background: #1D4ED8; }  /* VP / SVP  — depth 1 */
  .t2 { background: #0284C7; }  /* Director  — depth 2 */
  .t3 { background: #059669; }  /* Manager   — depth 3 */
  .t4 { background: #7C3AED; }  /* IC        — depth 4 */

  .t0-txt { color: #1E3A5F; }
  .t1-txt { color: #1D4ED8; }
  .t2-txt { color: #0284C7; }
  .t3-txt { color: #059669; }
  .t4-txt { color: #7C3AED; }
</style>
</head>
<body>
<div class="header">

  <!-- Left colour band — C-Suite depth colour -->
  <div class="band"></div>

  <div class="body">

    <!-- LEFT -->
    <div class="left">
      <div class="icon-wrap">
        <!-- Org-tree icon matching the node layout shape -->
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="1" width="6" height="4" rx="1" fill="rgba(255,255,255,0.9)"/>
          <rect x="1"  y="12" width="4.5" height="3.5" rx="1" fill="rgba(255,255,255,0.7)"/>
          <rect x="6.75" y="12" width="4.5" height="3.5" rx="1" fill="rgba(255,255,255,0.7)"/>
          <rect x="12.5" y="12" width="4.5" height="3.5" rx="1" fill="rgba(255,255,255,0.7)"/>
          <line x1="9"   y1="5"  x2="9"    y2="8"   stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
          <line x1="3.25" y1="8" x2="14.75" y2="8"  stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
          <line x1="3.25" y1="8" x2="3.25"  y2="12" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
          <line x1="9"    y1="8" x2="9"     y2="12" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
          <line x1="14.75" y1="8" x2="14.75" y2="12" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
        </svg>
      </div>

      <div class="titles">
        <span class="badge">▸ DASHBOARD</span>
        <span class="title">Unified Data View</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- RIGHT: tier legend — matches the bottom legend of the Vega visual -->
    <div class="legend">
      <div class="tier">
        <div class="swatch t0"></div>
        <span class="tier-label t0-txt">C-Suite</span>
      </div>
      <div class="tier">
        <div class="swatch t1"></div>
        <span class="tier-label t1-txt">VP / SVP</span>
      </div>
      <div class="tier">
        <div class="swatch t2"></div>
        <span class="tier-label t2-txt">Director</span>
      </div>
      <div class="tier">
        <div class="swatch t3"></div>
        <span class="tier-label t3-txt">Manager</span>
      </div>
      <div class="tier">
        <div class="swatch t4"></div>
        <span class="tier-label t4-txt">Indiv. Contributor</span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
