<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=220'>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    height: 100%;
    overflow: hidden;
  }

  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    padding: 16px 0 12px;
  }

  /* ── Section Label ── */
  .section-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    margin-bottom: 10px;
  }

  .section-label-text {
    font-size: 8.5px;
    font-weight: 700;
    color: rgba(0,0,0,0.32);
    text-transform: uppercase;
    letter-spacing: 1.3px;
    white-space: nowrap;
  }

  .section-label-line {
    flex: 1;
    height: 1px;
    background: rgba(0,0,0,0.08);
  }

  /* ── KPI Rows ── */
  .kpi-list {
    display: flex;
    flex-direction: column;
  }

  .kpi-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
  }

  .kpi-row:nth-child(even) {
    background: rgba(124,58,237,0.04);
  }

  .kpi-row-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .kpi-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .kpi-row:nth-child(1) .kpi-dot { background: #7c3aed; }
  .kpi-row:nth-child(2) .kpi-dot { background: #6d28d9; }
  .kpi-row:nth-child(3) .kpi-dot { background: #8b5cf6; }
  .kpi-row:nth-child(4) .kpi-dot { background: #a78bfa; }

  .kpi-label {
    font-size: 11px;
    font-weight: 500;
    color: rgba(0,0,0,0.50);
  }

  .kpi-value {
    font-size: 15px;
    font-weight: 700;
    color: #7c3aed;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>
<div class='panel'>

  <div class='section-label'>
    <span class='section-label-text'>SUMMARY</span>
    <div class='section-label-line'></div>
  </div>

  <div class='kpi-list'>
    <div class='kpi-row'>
      <div class='kpi-row-left'>
        <div class='kpi-dot'></div>
        <span class='kpi-label'>Source Systems</span>
      </div>
      <span class='kpi-value'>—</span>
    </div>
    <div class='kpi-row'>
      <div class='kpi-row-left'>
        <div class='kpi-dot'></div>
        <span class='kpi-label'>Databases</span>
      </div>
      <span class='kpi-value'>—</span>
    </div>
    <div class='kpi-row'>
      <div class='kpi-row-left'>
        <div class='kpi-dot'></div>
        <span class='kpi-label'>Users</span>
      </div>
      <span class='kpi-value'>—</span>
    </div>
    <div class='kpi-row'>
      <div class='kpi-row-left'>
        <div class='kpi-dot'></div>
        <span class='kpi-label'>Metrics</span>
      </div>
      <span class='kpi-value'>—</span>
    </div>
  </div>

</div>
</body>
</html>
