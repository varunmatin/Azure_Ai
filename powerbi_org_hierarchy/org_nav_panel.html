<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=220'>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 220px;
    height: 700px;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    display: flex;
    flex-direction: column;
    width: 220px;
    height: 700px;
    background: #ffffff;
    overflow: hidden;
  }

  /* ── Brand Header ── */
  .brand-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 12px;
    border-bottom: 1px solid rgba(124,58,237,0.10);
    flex-shrink: 0;
  }

  .logo-mark {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: linear-gradient(145deg, #7c3aed 0%, #6d28d9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -1px;
    box-shadow: 0 2px 8px rgba(124,58,237,0.30);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .brand-name {
    font-size: 15px;
    font-weight: 700;
    color: #1a0533;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }

  .brand-subtitle {
    font-size: 7.5px;
    font-weight: 600;
    color: rgba(0,0,0,0.38);
    text-transform: uppercase;
    letter-spacing: 0.9px;
    font-family: 'Courier New', Courier, monospace;
    white-space: nowrap;
  }

  /* ── Section Label ── */
  .section-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    margin-bottom: 12px;
  }

  .section-label-text {
    font-size: 8.5px;
    font-weight: 700;
    color: rgba(0,0,0,0.32);
    text-transform: uppercase;
    letter-spacing: 1.3px;
    white-space: nowrap;
  }

  .section-label-line {
    flex: 1;
    height: 1px;
    background: rgba(0,0,0,0.08);
  }

  /* ── KPI Section ── */
  .kpi-section {
    padding: 16px 0 12px;
    flex-shrink: 0;
  }

  /* ── KPI Grid ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 14px;
  }

  .kpi-card {
    background: #faf9ff;
    border: 1px solid rgba(124,58,237,0.12);
    border-radius: 10px;
    padding: 12px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .kpi-card:nth-child(1) { border-top: 3px solid #7c3aed; }
  .kpi-card:nth-child(2) { border-top: 3px solid #6d28d9; }
  .kpi-card:nth-child(3) { border-top: 3px solid #8b5cf6; }
  .kpi-card:nth-child(4) { border-top: 3px solid #a78bfa; }

  .kpi-label {
    font-size: 9px;
    font-weight: 600;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kpi-value {
    font-size: 20px;
    font-weight: 800;
    color: #1a0533;
    letter-spacing: -0.5px;
    line-height: 1;
  }
</style>
</head>
<body>
<div class='panel'>

  <!-- ── Brand Header ── -->
  <div class='brand-header'>
    <div class='logo-mark'>O</div>
    <div class='brand-text'>
      <div class='brand-name'>OrgIntel</div>
      <div class='brand-subtitle'>People &amp; Structure Analytics</div>
    </div>
  </div>

  <!-- ── KPI Summary ── -->
  <div class='kpi-section'>
    <div class='section-label'>
      <span class='section-label-text'>SUMMARY</span>
      <div class='section-label-line'></div>
    </div>
    <div class='kpi-grid'>
      <div class='kpi-card'>
        <span class='kpi-label'>KPI 1</span>
        <span class='kpi-value'>—</span>
      </div>
      <div class='kpi-card'>
        <span class='kpi-label'>KPI 2</span>
        <span class='kpi-value'>—</span>
      </div>
      <div class='kpi-card'>
        <span class='kpi-label'>KPI 3</span>
        <span class='kpi-value'>—</span>
      </div>
      <div class='kpi-card'>
        <span class='kpi-label'>KPI 4</span>
        <span class='kpi-value'>—</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
